services:
  postgres:
    image: postgres:16
    container_name: muloo-deployos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: muloo_smoke
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke
    ports:
      - "5432:5432"
    volumes:
      - muloo_deployos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d muloo_smoke"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  muloo_deployos_postgres_data:
